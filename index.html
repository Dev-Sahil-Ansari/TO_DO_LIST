<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="ToDoList.css">
</head>
<body>
    <span class="mainContainer">
        <h1>To Do List</h1>
        <br>
        <div class="task-assing-area">
            <input placeholder="Write the Task" class="task-assigning" type="text">
            <button type="button" class="add">ADD Task</button>
        </div>
        <br>
        <div class="task-showing-area">
        </div>
        <p class="msg">Number of Tasks: 0</p>
        <p class="taskCompleted">Task Completed : 0</p>
        <button class="delete" type="button">Delete Task</button>
        <p class="credit"><a href="https://github.com/Dev-Sahil-Ansari" target="_blank" rel="non-reference" >Made By Dev-Sahil-Ansari</a></p>
        </span>
    <script src="ToDoList.js" ></script>
</body>
</html>
